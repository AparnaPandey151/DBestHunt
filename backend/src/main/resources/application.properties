spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/dbesthunt
spring.datasource.username=${DBESTHUNT_DB_USERNAME}
spring.datasource.password=${DBESTHUNT_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
firecrawl.api-key=${FIRECRAWL_API_KEY}
resend.api-key=${RESEND_API_KEY}
resend.from-email=onboarding@resend.dev
resend.to-email=${RESEND_TO_EMAIL}